<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de contactos</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <h1>Encuentra el <span class="highlight">contacto ideal</span> para llamar</h1>
    <p class="subtitle">
      Ingresa el nombre de una empresa y te mostramos los mejores contactos para
      llamar (ventas, trade marketing, mercadeo, marketing, category manager o
      gerente general).
    </p>

    <form id="search-form">
      <div class="search-input-wrap">
        <input
          type="text"
          id="company-input"
          name="company"
          placeholder="Ej: Nestlé, Alpina, Grupo Éxito..."
          autocomplete="off"
          required
        />
        <ul id="suggestions-list" class="suggestions" hidden></ul>
      </div>
      <button type="submit" id="search-button">Buscar contactos</button>
    </form>

    <div id="result-area" aria-live="polite"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
